services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /pi_agent
    stdin_open: true
    tty: true
    init: true
    command: ["sleep", "infinity"]
    # Every entry in .env reaches this container, so a new credential needs no
    # compose change. Missing .env is not an error: the container then starts
    # without provider credentials, which the smoke test relies on.
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/pi_agent
      - pi-agent:/root/.pi/agent
      - opencode-data:/root/.local/share/opencode
      - opencode-cache:/root/.cache/opencode
      - opencode-state:/root/.local/state/opencode
      - ssh-data:/root/.ssh
      - nvim-data:/root/.local/share/nvim
      - nvim-cache:/root/.cache/nvim
      - nvim-state:/root/.local/state/nvim
      - tmux-plugins:/root/.local/share/tmux/plugins

volumes:
  pi-agent:
  opencode-data:
  opencode-cache:
  opencode-state:
  ssh-data:
  nvim-data:
  nvim-cache:
  nvim-state:
  tmux-plugins:
