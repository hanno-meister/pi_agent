services:
  pi:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /pi_agent
    stdin_open: true
    tty: true
    init: true
    command: ["sleep", "infinity"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VOICE_GATEWAY_URL: http://voice-gateway:4317
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-en}
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-120}
      VOICE_TRANSCRIPTION_MODEL: ${VOICE_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
    volumes:
      - .:/pi_agent
      - pi-agent:/root/.pi/agent
      - opencode-data:/root/.local/share/opencode
      - opencode-cache:/root/.cache/opencode
      - opencode-state:/root/.local/state/opencode
      - ssh-data:/root/.ssh
      - nvim-data:/root/.local/share/nvim
      - nvim-cache:/root/.cache/nvim
      - nvim-state:/root/.local/state/nvim
      - tmux-plugins:/root/.local/share/tmux/plugins
    depends_on:
      voice-gateway:
        condition: service_healthy

  voice-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    entrypoint: ["node", "/pi_agent/voice-input/gateway.js"]
    command: []
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOICE_GATEWAY_PORT: 4317
      VOICE_LANGUAGE: ${VOICE_LANGUAGE:-en}
      VOICE_MAX_DURATION_SECONDS: ${VOICE_MAX_DURATION_SECONDS:-120}
      VOICE_TRANSCRIPTION_MODEL: ${VOICE_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
    ports:
      - "127.0.0.1:${VOICE_GATEWAY_PORT:-4317}:4317"
    volumes:
      - .:/pi_agent:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pi-agent:
  opencode-data:
  opencode-cache:
  opencode-state:
  ssh-data:
  nvim-data:
  nvim-cache:
  nvim-state:
  tmux-plugins:
