name: Fast checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run offline fast checks
        run: bash tests/check-fast.sh
